openapi: 3.0.3
info:
  title: Life Simulator API (borde REST)
  description: >
    Contrato de borde navegador→backend para la feature
    002-simulacion-vida. Reemplaza por completo al contrato de finanzas de la
    feature 001 (FR-009, SC-009: 0 endpoints de finanzas).
    Consumido por el frontend server-side de Next.js y por la prueba de
    contrato `tests/test_rest_contract.py`.
  version: 1.0.0
servers:
  - url: /
    description: raíz (uso directo y pruebas)
  - url: /api
    description: prefijo publicado por el ALB hacia el backend
paths:
  /health:
    get:
      operationId: health
      summary: Readiness del adaptador REST
      responses:
        "200":
          description: servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /lives:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      operationId: createLife
      summary: Crea una vida validando los datos de nacimiento (FR-001)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLifeRequest"
      responses:
        "201":
          description: vida creada; las cuatro stats empiezan en 50 (FR-010)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Life"
        "422":
          description: falta un dato obligatorio o el año está fuera de rango
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"
        "409":
          description: ya existe una vida para este jugador (una partida en v1, FR-008)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      operationId: getLife
      summary: Retoma la vida en curso tras recargar o reiniciar (FR-008)
      responses:
        "200":
          description: vida en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Life"
        "404":
          description: no hay vida para este jugador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteLife
      summary: Elimina la vida para empezar otra (FR-005)
      responses:
        "204":
          description: vida eliminada; el jugador puede crear una nueva
        "404":
          description: no hay vida para este jugador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lives/advance:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      operationId: advanceLife
      summary: >
        Avanza un período, aplica la deriva natural y presenta un único
        evento con sus opciones (FR-002, FR-003, FR-011)
      responses:
        "200":
          description: período avanzado y evento presentado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvanceResponse"
        "404":
          description: no hay vida en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: la vida ya terminó (FR-005)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lives/decision:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    post:
      operationId: submitDecision
      summary: >
        Registra la opción elegida, aplica los deltas sobre las stats y
        resuelve la muerte si procede (FR-003, FR-004, FR-005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecisionRequest"
      responses:
        "200":
          description: decisión aplicada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionResponse"
        "404":
          description: no hay vida en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: no hay evento pendiente de decisión
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lives/summary:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    get:
      operationId: getSummary
      summary: >
        Resumen de fin de vida: edad alcanzada, causa de muerte y desglose
        por educación, trabajo y relaciones (FR-005)
      responses:
        "200":
          description: resumen disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LifeSummary"
        "404":
          description: no hay vida para este jugador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: la vida sigue en curso; el resumen existe al morir
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /lives/events:
    parameters:
      - $ref: "#/components/parameters/PlayerId"
    get:
      operationId: getEventHistory
      summary: >
        Histórico cronológico de los sucesos ya vividos, con la opción
        elegida y sus deltas (data-model §2)
      responses:
        "200":
          description: >
            histórico en orden cronológico (seq ascendente); lista vacía si
            la vida existe pero aún no ha resuelto ningún período
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventHistory"
        "404":
          description: no hay vida para este jugador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: falta o es inválida la cabecera X-Player-Id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationError"

  /catalog/birth:
    get:
      operationId: getBirthCatalog
      summary: Catálogo acotado de países y ciudades para crear el personaje (FR-001)
      responses:
        "200":
          description: catálogo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BirthCatalog"

components:
  parameters:
    PlayerId:
      name: X-Player-Id
      in: header
      required: true
      description: Identificador anónimo UUID v4 generado en el navegador (FR-008)
      schema:
        type: string
        format: uuid

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    Stats:
      type: object
      description: Cuatro stats básicas en escala 0–100 (FR-004). Solo estas cuatro en v1.
      required: [health, happiness, intelligence, looks]
      additionalProperties: false
      properties:
        health:      { type: integer, minimum: 0, maximum: 100, example: 50 }
        happiness:   { type: integer, minimum: 0, maximum: 100, example: 50 }
        intelligence: { type: integer, minimum: 0, maximum: 100, example: 50 }
        looks:       { type: integer, minimum: 0, maximum: 100, example: 50 }

    PersonaCercana:
      type: object
      required: [name, relation, state]
      properties:
        name:     { type: string, example: "María" }
        relation:
          type: string
          enum: [FATHER, MOTHER, SIBLING, FRIEND, PARTNER]
        state:
          type: string
          enum: [ALIVE, DEAD, TOGETHER, SEPARATED, ESTRANGED]
          description: >
            `TOGETHER`/`SEPARATED` sólo aplican a `PARTNER`; `ESTRANGED` es el
            final de un hermano o un amigo (FR-018).
        relationship:
          type: integer
          minimum: 0
          maximum: 100
          description: >
            Calidad de la relación 0–100, oculta para el jugador como número y
            visible como barra en el perfil. Decae cada período y la mueven las
            decisiones de RELATIONSHIPS (FR-018).
          example: 70

    Granularity:
      type: string
      enum: [YEAR, MONTH]
      default: YEAR

    LifeStatus:
      type: string
      enum: [ALIVE, DEAD]

    CreateLifeRequest:
      type: object
      required: [gender, country, city, birth_year]
      additionalProperties: false
      properties:
        gender:
          type: string
          enum: [MALE, FEMALE]
        country:
          type: string
          description: código del catálogo de nacimiento
          example: AR
        city:
          type: string
          example: Buenos Aires
        birth_year:
          type: integer
          minimum: 1900
          # Sin `maximum` estático: la regla es `1900 ≤ birth_year ≤ año actual`
          # (spec, Assumptions y data-model.md), y OpenAPI no puede expresar el
          # año en curso. El servidor devuelve 422 fuera de ese rango y el
          # detalle lo recoge el ejemplo de ValidationError.
          description: año de nacimiento, entre 1900 y el año actual
          example: 1990
        granularity:
          $ref: "#/components/schemas/Granularity"

    Life:
      type: object
      required: [player_id, gender, country, city, birth_year, granularity,
                 age_months, current_year, stats, status, people]
      properties:
        player_id:
          type: string
          format: uuid
        gender:
          type: string
          enum: [MALE, FEMALE]
        country:  { type: string, example: AR }
        city:     { type: string, example: Buenos Aires }
        birth_year: { type: integer, example: 1990 }
        granularity:
          $ref: "#/components/schemas/Granularity"
        age_months:
          type: integer
          description: edad en meses; avanza 12 o 1 según la granularidad
          example: 0
        current_year:
          type: integer
          example: 1990
        stats:
          $ref: "#/components/schemas/Stats"
        status:
          $ref: "#/components/schemas/LifeStatus"
        cause_of_death:
          type: string
          nullable: true
          enum: [HEALTH_ZERO, FATAL_OPTION, FATAL_RANDOM, null]
        people:
          type: array
          items:
            $ref: "#/components/schemas/PersonaCercana"
        pending_event:
          nullable: true
          default: null
          description: >
            Suceso presentado en el período en curso y todavía sin decidir,
            o `null` si no lo hay. Sólo lo devuelve `GET /lives`, para que
            recargar la página retome la partida sin perder ese progreso
            (SC-006); `POST /lives/advance` lo trae en su campo `events`.
          allOf:
            - $ref: "#/components/schemas/PresentedEvent"

    EventOption:
      type: object
      required: [id, label]
      properties:
        id:      { type: string, example: "opt-1" }
        label:   { type: string, example: "Ignorar la noticia" }
        fatal:
          type: boolean
          default: false
          description: si es true, elegir esta opción muere al personaje (FR-005a)

    PresentedEvent:
      type: object
      required: [id, type, text, options]
      properties:
        id:    { type: string, example: "1990-acontecimientos-0042" }
        type:
          type: string
          enum: [MAIN, DAILY, RELATIONSHIPS]
          description: >
            MAIN es el suceso destacado del año; DAILY y RELATIONSHIPS salen del
            perfil de la década (FR-003).
        text:
          type: string
          description: enunciado en español, derivado de un suceso real de la época
          example: "Este año tu país entra en una crisis económica importante."
        year:
          type: integer
          example: 1990
        source:
          type: string
          enum: [WIKIPEDIA, SEED]
          description: SEED cuando falló la búsqueda externa (edge cases)
        country:
          type: string
          description: país al que pertenece el suceso (FR-002)
          example: "AR"
        options:
          type: array
          minItems: 2
          maxItems: 4
          items:
            $ref: "#/components/schemas/EventOption"

    AdvanceResponse:
      type: object
      required: [life, age_years, events, period_complete]
      properties:
        life:
          $ref: "#/components/schemas/Life"
        age_years:
          type: integer
          description: edad en años cumplidos al abrir el período
          example: 1
        events:
          type: array
          minItems: 1
          maxItems: 3
          description: >
            El lote del período: un DAILY, un RELATIONSHIPS y el MAIN del año,
            que el jugador resuelve en orden con `POST /lives/decision` (FR-007).
          items:
            $ref: "#/components/schemas/PresentedEvent"
        period_complete:
          type: boolean
          description: >
            `false` justo después de avanzar, porque el avance **abre** el
            período; pasa a `true` en la decisión que resuelve su último suceso.
        derived:
          type: object
          description: delta aplicado por la deriva natural de este período (FR-011)
          properties:
            health:     { type: integer, example: -1 }
            happiness:  { type: integer, example: 3 }

    DecisionRequest:
      type: object
      required: [event_id, option_id]
      additionalProperties: false
      properties:
        event_id:
          type: string
          description: >
            Debe ser el suceso pendiente del lote (`pending_batch[batch_cursor]`).
            Si no coincide, la respuesta es `409` (FR-007).
          example: "1990-acontecimientos-0042"
        option_id:
          type: string
          example: "opt-1"

    DecisionResponse:
      type: object
      required: [life, deltas, dead, period_complete]
      properties:
        life:
          $ref: "#/components/schemas/Life"
        deltas:
          type: object
          description: cambio aplicado sobre las stats (SC-003)
          additionalProperties:
            type: integer
          example: { health: -5, happiness: 8 }
        period_complete:
          type: boolean
          description: >
            `true` cuando esta decisión resolvió el último suceso del período y
            se puede volver a avanzar (FR-007).
        dead:
          type: boolean
        cause_of_death:
          type: string
          nullable: true
          enum: [HEALTH_ZERO, FATAL_OPTION, FATAL_RANDOM, null]

    LifeSummary:
      type: object
      required: [age_reached, cause_of_death, by_system]
      properties:
        age_reached:
          type: integer
          description: edad alcanzada, en años cumplidos
          example: 47
        cause_of_death:
          type: string
          enum: [HEALTH_ZERO, FATAL_OPTION, FATAL_RANDOM]
        by_system:
          type: object
          description: desglose por sistema de FR-006 (FR-005)
          required: [education, work, relationships]
          properties:
            education:
              $ref: "#/components/schemas/SystemDigest"
            work:
              $ref: "#/components/schemas/SystemDigest"
            relationships:
              $ref: "#/components/schemas/SystemDigest"

    SystemDigest:
      type: object
      properties:
        events:
          type: integer
          example: 12
        decisions:
          type: integer
          example: 12
        highlights:
          type: array
          items:
            type: string
          maxItems: 5
          example: ["Terminaste la universidad", "Conociste a tu pareja"]

    EventHistory:
      type: object
      description: >
        Histórico de sucesos ya vividos de una vida, en orden cronológico
        (seq ascendente).
      required: [player_id, count, events]
      properties:
        player_id:
          type: string
          format: uuid
        count:
          type: integer
          description: nº de eventos del histórico
          example: 2
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventHistoryItem"

    EventHistoryItem:
      type: object
      required: [seq, period_index, age_months, age_years, event_id, type,
                 text, option_id, option_label, deltas, fatal, source]
      properties:
        seq:
          type: integer
          description: nº de evento; orden cronológico lexicográfico en `EVENT#<seq:06d>`
          example: 1
        period_index:
          type: integer
          example: 1
        age_months:
          type: integer
          example: 12
        age_years:
          type: integer
          description: edad cumplida al resolver el período (age_months / 12)
          example: 1
        event_id:
          type: string
          example: generic-cotidiano
        type:
          type: string
          enum: [COTIDIANO, EDUCATIVO, LABORAL, RELACION, SENTIMENTAL]
        text:
          type: string
          example: "Un imprevisto doméstico tuerce el plan que tenías para el día."
        option_id:
          type: string
          example: "opt-1"
        option_label:
          type: string
          description: >
            etiqueta de la opción elegida; en las filas antiguas, escritas
            sin etiqueta, se devuelve el propio option_id
          example: "Afrontarlo con calma"
        deltas:
          type: object
          description: cambio que aplicó la decisión sobre las stats (SC-003)
          additionalProperties:
            type: integer
          example: { happiness: 4, health: 1 }
        fatal:
          type: boolean
          example: false
        source:
          type: string
          enum: [WIKIPEDIA, SEED]
          description: SEED cuando falló la búsqueda externa (edge cases)

    BirthCatalog:
      type: object
      required: [countries]
      properties:
        countries:
          type: array
          items:
            type: object
            required: [code, name, cities]
            properties:
              code:  { type: string, example: AR }
              name:  { type: string, example: Argentina }
              cities:
                type: array
                items:
                  type: string
                example: [Buenos Aires, Córdoba, Rosario]

    Error:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "no hay vida en curso para este jugador"

    ValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: string
          example: "birth_year debe estar entre 1900 y el año actual"

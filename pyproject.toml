[project]
name = "finance-backend"
version = "0.1.0"
description = "Backend del servicio de finanzas (borde REST + gRPC interno)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142.2",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "protobuf>=7.36.2",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

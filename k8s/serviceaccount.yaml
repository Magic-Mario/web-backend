# ServiceAccount del backend con IRSA (T085).
#
# Sin esta pieza el pod asume la *node role* del nodo y la política de su
# tabla (`life-simulator-mvp-lives`, sólo lectura/escritura sobre ESE recurso)
# no le llega: el primer `put_item` revienta con AccessDenied. `iam.tf`
# restringe el rol a `system:serviceaccount:default:backend`, así que el
# ServiceAccount tiene que llamarse exactamente `backend` en el namespace
# `default`.
#
# El ARN sale de `terraform output -json irsa_role_arn` → `.backend`.
# La misma pieza para el microservicio vive en
# `web-events-service/k8s/serviceaccount.yaml`.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  labels:
    app: backend
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/life-simulator-mvp-backend-irsa

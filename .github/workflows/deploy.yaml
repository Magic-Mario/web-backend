# Repo backend: build + push + deploy solo del backend (FR-018, FR-019, SC-007).
# Tags inmutables :git-sha y :semver; nunca latest en prod.
# El rollback SOLO aplica si falla el smoke del propio backend. El health check
# del frontend es informativo (continue-on-error): no bloquea ni revierte el
# deploy del backend, pero deja la evidencia de SC-007.
name: backend-deploy

on:
  push:
    branches: [main]

env:
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  SERVICE: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - name: Build + push (:sha y :semver)
        run: |
          SHA_TAG="${ECR_REGISTRY}/${SERVICE}:${GITHUB_SHA}"
          SEMVER="${GITHUB_REF_NAME#v}"
          docker buildx build --push \
            -t "$SHA_TAG" -t "${ECR_REGISTRY}/${SERVICE}:${SEMVER}" .
          echo "IMAGE=$SHA_TAG" >> "$GITHUB_ENV"
      - name: kubectl apply con el tag explícito
        run: |
          sed -i "s|image: BACKEND_IMAGE|image: ${IMAGE}|" k8s/deployment.yaml
          kubectl apply -f k8s/ && kubectl rollout status deployment/backend
        env:
          KUBECONFIG: ${{ secrets.BACKEND_KUBECONFIG }}
      - name: Smoke del backend
        id: smoke
        run: curl -sf "http://${{ vars.BACKEND_URL }}/balance"
      - name: Revertir si el propio backend no responde
        if: failure() && steps.smoke.outcome == 'failure'
        run: kubectl rollout undo deployment/backend
        env:
          KUBECONFIG: ${{ secrets.BACKEND_KUBECONFIG }}
      - name: Health check del frontend (informativo, SC-007)
        if: always()
        continue-on-error: true
        run: |
          if curl -sf --max-time 10 "http://${{ vars.FRONTEND_URL }}/api/balance"; then
            echo "frontend OK"
          else
            echo "frontend NO RESPONDE — no bloquea este deploy"
          fi
